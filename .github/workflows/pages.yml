# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Build Jaspr
        run: |
          dart pub global activate jaspr_cli 0.23.5
          dart pub get
          dart run tool/generate_page_html.dart --check
          jaspr build
          # GitHub Pages serves 404.html for unknown paths. Reusing the app shell lets the router show its own
          # not-found page.
          cp build/jaspr/index.html build/jaspr/404.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/jaspr
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
